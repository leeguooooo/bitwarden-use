name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v0.2.0)"
        required: true
permissions:
  contents: read
jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag and manifest agree
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml','rb') as f:
              version = tomllib.load(f)['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - name: Format and unit tests
        run: |
          python3 tools/test_install.py
          cargo fmt --all --check
          cargo test --locked --lib --bins
          cargo test --locked --no-default-features --bin bitwarden-use cli_tests
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package and smoke test
        shell: bash
        run: |
          set -euo pipefail
          name="bitwarden-use-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/bitwarden-use" "$name/"
          cp "target/${{ matrix.target }}/release/bitwarden-use-agent" "$name/"
          cp LICENSE "$name/"
          cp docs/release.html "$name/0-README.html"
          "$name/bitwarden-use" --version
          "$name/bitwarden-use" set --help
          "$name/bitwarden-use" login --help
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            bitwarden-use-*.tar.gz
            bitwarden-use-*.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify complete release
        run: |
          test "$(find release -name '*.tar.gz' | wc -l)" -eq 4
          cd release
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
